<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>베베오디오</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="베베오디오">
  <meta name="theme-color" content="#F7F4EE">

  <script>
    (function() {
      try {
        const c = document.createElement('canvas');
        c.width = 180;
        c.height = 180;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#FDFBF7';
        ctx.fillRect(0, 0, 180, 180);
        ctx.fillStyle = '#FAF0DD';
        if (ctx.roundRect) {
          ctx.beginPath();
          ctx.roundRect(14, 14, 152, 152, 36);
          ctx.fill();
        } else {
          ctx.fillRect(14, 14, 152, 152);
        }
        ctx.font = '86px "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🎶', 90, 93);

        const iconUrl = c.toDataURL('image/png');
        const appleIcon = document.createElement('link');
        appleIcon.rel = 'apple-touch-icon';
        appleIcon.href = iconUrl;
        document.head.appendChild(appleIcon);

        const fav = document.createElement('link');
        fav.rel = 'icon';
        fav.type = 'image/png';
        fav.href = iconUrl;
        document.head.appendChild(fav);
      } catch(e) {}
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    :root {
      --bg-warm: #F7F4EE;
      --paper-cream: #FCFAF6;
      --paper-border: #E8E1D5;
      --stack-shadow: #DFD7C8;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }

    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: var(--bg-warm);
      color: #38312C;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      letter-spacing: -0.02em;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .songbook-stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 1.5rem;
    }

    .songbook-stack-base {
      position: absolute;
      inset: 0;
      border-radius: 1.5rem;
      background: #EDE6DB;
      box-shadow: 
        1px 2px 0 var(--stack-shadow),
        3px 4px 0 #D5CBB9,
        0 12px 24px rgba(70, 50, 30, 0.08);
      z-index: 1;
    }

    .songbook-sheet {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: var(--paper-cream);
      border-radius: 1.5rem;
      border: 1px solid var(--paper-border);
      overflow: hidden;
      will-change: transform, box-shadow;
    }

    .binder-ring-hole {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: #8A7E72;
      box-shadow: inset 1px 1px 2px rgba(0,0,0,0.35), 0 0 0 2px #EDE7DC;
    }

    .sheet-slide-out-left {
      animation: animSlideOutLeft 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes animSlideOutLeft {
      0% {
        transform: translateX(0);
        box-shadow: 2px 0 12px rgba(60, 45, 30, 0.06);
      }
      100% {
        transform: translateX(-105%);
        box-shadow: 20px 0 30px rgba(60, 45, 30, 0.16);
      }
    }

    .sheet-slide-in-from-left {
      animation: animSlideInLeft 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes animSlideInLeft {
      0% {
        transform: translateX(-105%);
        box-shadow: 20px 0 30px rgba(60, 45, 30, 0.16);
      }
      100% {
        transform: translateX(0);
        box-shadow: 2px 0 12px rgba(60, 45, 30, 0.06);
      }
    }

    .soundbook-tile {
      box-shadow: 0 3px 0 #D8D0C3, 0 5px 10px rgba(50, 40, 30, 0.04);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      touch-action: manipulation;
      outline: none !important;
    }
    .soundbook-tile:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #D8D0C3;
    }
    .soundbook-tile.is-playing {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #D8D0C3 !important;
      border-color: #D3C4AF !important;
    }

    .color-swatch {
      position: relative;
      transition: transform 0.1s ease;
    }
    .color-swatch:active {
      transform: scale(0.92);
    }

    .time-timer-dial {
      transition: background 0.25s linear;
    }
  </style>
</head>
<body class="flex flex-col justify-between items-center p-2.5 sm:p-4 max-w-lg mx-auto">

  <header class="w-full flex items-center justify-between gap-1.5 pb-1 flex-shrink-0 z-20">
    <div id="filter-chip-container" class="flex-1 flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1 pr-1"></div>

    <div class="flex items-center gap-1 flex-shrink-0">
      <button id="btn-shuffle" class="w-8 h-8 rounded-full bg-white/90 text-stone-700 shadow-sm border border-stone-200 flex items-center justify-center text-xs active:scale-95 transition-all">
        <i class="fa-solid fa-shuffle"></i>
      </button>
      <button id="btn-repeat-mode" class="w-8 h-8 rounded-full bg-white/90 text-stone-700 shadow-sm border border-stone-200 flex items-center justify-center text-xs active:scale-95 transition-all relative">
        <i id="repeat-icon" class="fa-solid fa-arrow-right text-[11px]"></i>
        <span id="repeat-badge" class="hidden absolute -top-1 -right-1 bg-amber-500 text-white rounded-full text-[8px] font-black w-3.5 h-3.5 flex items-center justify-center">1</span>
      </button>
      <button id="btn-play-all" class="w-8 h-8 rounded-full bg-white/90 text-stone-700 shadow-sm border border-stone-200 flex items-center justify-center text-xs active:scale-95 transition-all">
        <i class="fa-solid fa-play text-[11px] ml-0.5"></i>
      </button>
      <button id="btn-stop-all" class="w-8 h-8 rounded-full bg-white/90 text-stone-600 shadow-sm border border-stone-200 flex items-center justify-center text-xs active:scale-95 transition-all">
        <i class="fa-solid fa-stop"></i>
      </button>
      <button id="btn-timer-quick" class="w-8 h-8 rounded-full bg-white/90 text-stone-700 shadow-sm border border-stone-200 flex items-center justify-center text-xs active:scale-95 transition-all relative">
        <i class="fa-regular fa-clock text-[12px]"></i>
        <span id="quick-timer-badge" class="hidden absolute -top-1 -right-1 bg-amber-500 text-white rounded-full text-[8px] font-black px-1 h-3.5 flex items-center justify-center"></span>
      </button>
      <button id="btn-open-settings" class="w-8 h-8 rounded-full bg-stone-200/70 text-stone-600 shadow-sm border border-stone-300/60 flex items-center justify-center text-xs active:scale-95 transition-all">
        <i class="fa-solid fa-gear"></i>
      </button>
    </div>
  </header>

  <!-- Quick Timer Popover -->
  <div id="quick-timer-popover" class="hidden absolute top-12 right-3 z-40 bg-white/95 backdrop-blur-md rounded-2xl shadow-xl border border-stone-200 p-3 w-64 space-y-2.5">
    <div class="flex items-center justify-between">
      <span class="text-xs font-bold text-stone-800 flex items-center gap-1.5">
        <i class="fa-regular fa-clock text-amber-600"></i> <span id="ui-quick-timer-title">재생 타이머</span>
      </span>
      <span id="quick-timer-status" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-stone-100 text-stone-600">꺼짐</span>
    </div>
    <div class="flex items-center gap-1.5">
      <input type="number" id="input-quick-timer" min="0" max="180" placeholder="0"
             class="flex-1 px-2.5 py-1 text-xs text-center rounded-lg border border-stone-200 bg-stone-50 font-bold text-stone-800 focus:outline-none focus:bg-white">
      <span class="text-xs text-stone-600 font-medium">분</span>
      <button id="btn-quick-timer-apply" class="px-2.5 py-1 bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-300 rounded-lg text-xs font-bold active:scale-95 transition-all">설정</button>
      <button id="btn-quick-timer-off" class="px-2 py-1 bg-stone-100 hover:bg-stone-200 text-stone-600 border border-stone-200 rounded-lg text-xs font-bold active:scale-95 transition-all">끄기</button>
    </div>
    <div class="grid grid-cols-4 gap-1">
      <button type="button" class="btn-timer-chip py-1 text-[11px] font-bold rounded-lg border bg-stone-50 border-stone-200 text-stone-700 hover:bg-stone-100" data-min="5">5분</button>
      <button type="button" class="btn-timer-chip py-1 text-[11px] font-bold rounded-lg border bg-stone-50 border-stone-200 text-stone-700 hover:bg-stone-100" data-min="10">10분</button>
      <button type="button" class="btn-timer-chip py-1 text-[11px] font-bold rounded-lg border bg-stone-50 border-stone-200 text-stone-700 hover:bg-stone-100" data-min="15">15분</button>
      <button type="button" class="btn-timer-chip py-1 text-[11px] font-bold rounded-lg border bg-stone-50 border-stone-200 text-stone-700 hover:bg-stone-100" data-min="30">30분</button>
    </div>
  </div>

  <main class="w-full flex-1 flex flex-col items-center justify-center my-1 relative min-h-0">
    <div id="book-stage" class="songbook-stage max-h-[78vh]">
      <div class="songbook-stack-base"></div>

      <div id="under-sheet" class="songbook-sheet flex items-stretch z-10">
        <div class="w-6 sm:w-7 bg-[#F6F1E8] border-r border-dashed border-stone-300/60 flex flex-col justify-around items-center py-4 flex-shrink-0">
          <div class="binder-ring-hole"></div>
          <div class="binder-ring-hole"></div>
          <div class="binder-ring-hole"></div>
          <div class="binder-ring-hole"></div>
        </div>
        <div class="under-grid flex-1 grid grid-cols-2 grid-rows-3 gap-2 sm:gap-2.5 p-2 sm:p-2.5"></div>
      </div>

      <div id="active-sheet" class="songbook-sheet flex items-stretch z-20">
        <div class="w-6 sm:w-7 bg-[#F6F1E8] border-r border-dashed border-stone-300/60 flex flex-col justify-around items-center py-4 flex-shrink-0">
          <div class="binder-ring-hole"></div>
          <div class="binder-ring-hole"></div>
          <div class="binder-ring-hole"></div>
          <div class="binder-ring-hole"></div>
        </div>
        <div id="active-grid" class="flex-1 grid grid-cols-2 grid-rows-3 gap-2 sm:gap-2.5 p-2 sm:p-2.5"></div>
      </div>

      <!-- Time Timer Overlay (Final 60 Seconds) -->
      <div id="visual-timer-container" class="hidden absolute inset-0 z-30 flex items-center justify-center pointer-events-none transition-opacity duration-300">
        <div class="bg-white/90 backdrop-blur-md rounded-3xl p-4 shadow-2xl border border-stone-200/90 flex flex-col items-center justify-center gap-2 transform transition-transform">
          <div class="text-[11px] font-extrabold text-stone-600 flex items-center gap-1">
            <span>⏰</span>
            <span id="visual-timer-label">곧 노래가 끝나요</span>
          </div>
          
          <div class="relative w-32 h-32 rounded-full bg-stone-100 border-4 border-stone-200 flex items-center justify-center shadow-inner overflow-hidden">
            <div class="absolute top-1 w-1 h-2 bg-stone-400 rounded-full z-10"></div>
            <div id="visual-timer-disk" class="time-timer-dial absolute inset-0 rounded-full"></div>
            <div class="relative z-10 w-14 h-14 rounded-full bg-white shadow-md flex flex-col items-center justify-center border border-stone-100">
              <span id="visual-timer-seconds" class="text-base font-black text-rose-500">60</span>
              <span class="text-[8px] font-bold text-stone-400 -mt-1">SEC</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="w-full flex flex-col items-center justify-center pt-0.5 pb-1 flex-shrink-0 z-20">
    <div class="w-full flex items-center justify-between h-9 px-1">
      <button id="btn-prev-page" class="w-9 h-9 rounded-2xl bg-white/95 shadow-sm text-stone-700 border border-stone-200 flex items-center justify-center text-sm active:scale-95 transition-all disabled:opacity-20 disabled:pointer-events-none">
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <div class="flex items-center gap-2">
        <div id="page-dots" class="flex items-center gap-1.5"></div>
        <span id="page-text" class="text-xs font-bold text-stone-500 ml-1">1 / 1</span>
      </div>

      <button id="btn-next-page" class="w-9 h-9 rounded-2xl bg-white/95 shadow-sm text-stone-700 border border-stone-200 flex items-center justify-center text-sm active:scale-95 transition-all disabled:opacity-20 disabled:pointer-events-none">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <div class="mt-0.5 text-center">
      <span id="ui-copyright" class="text-[10px] font-semibold text-stone-400 select-none">© 2026 엄마</span>
    </div>
  </footer>

  <!-- Settings Modal -->
  <div id="parent-modal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4 hidden">

      <div class="flex items-center justify-between border-b border-stone-200 pb-2">
        <div class="flex items-center gap-2">
          <h3 id="ui-settings-title" class="text-sm font-bold text-stone-800">설정</h3>
          <div class="flex items-center bg-stone-200/80 rounded-lg p-0.5 border border-stone-300/60">
            <button type="button" id="btn-ui-lang-ko" class="px-2 py-0.5 text-[10px] font-bold rounded bg-white text-stone-800 shadow-sm transition-all">KO</button>
            <button type="button" id="btn-ui-lang-en" class="px-2 py-0.5 text-[10px] font-bold rounded text-stone-500 transition-all">EN</button>
          </div>
        </div>
        <button id="btn-close-modal" class="w-6 h-6 rounded-lg bg-white text-stone-500 flex items-center justify-center shadow-sm border border-stone-200 active:scale-95">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>

      <!-- Add / Edit Item Box -->
      <div id="card-editor-card" class="bg-white p-2.5 rounded-xl border border-stone-200 space-y-2 transition-all">
        <div class="flex items-center justify-between">
          <div id="ui-label-new-item" class="text-xs font-bold text-stone-800">새 항목</div>
          <button type="button" id="btn-cancel-edit" class="hidden text-[11px] font-bold text-rose-500 hover:underline">수정 취소</button>
        </div>

        <div class="w-full">
          <input type="text" id="new-title" placeholder="제목"
                 class="w-full px-2.5 py-1.5 text-xs rounded-lg border border-stone-200 bg-stone-50 focus:outline-none focus:bg-white font-medium">
        </div>

        <div>
          <div id="ui-label-select-cat" class="text-[11px] font-bold text-stone-600 mb-1">카테고리 선택</div>
          <div id="add-modal-category-bubbles" class="flex flex-wrap gap-1 max-h-20 overflow-y-auto p-1 bg-stone-50 rounded-lg border border-stone-200/80 min-h-7">
          </div>
        </div>

        <div>
          <div class="grid grid-cols-2 gap-1 mb-1.5">
            <button type="button" id="tab-cover-text" class="py-1 text-xs font-bold rounded-lg border bg-amber-50 border-amber-200 text-amber-900 flex items-center justify-center transition-colors">
              색상 & 이모지
            </button>
            <button type="button" id="tab-cover-pic" class="py-1 text-xs font-bold rounded-lg border bg-stone-50 border-stone-200 text-stone-600 flex items-center justify-center transition-colors">
              사진
            </button>
          </div>

          <div id="panel-cover-pic" class="hidden">
            <label class="flex items-center justify-center gap-2 w-full py-2.5 px-3 bg-stone-50 hover:bg-stone-100 border border-stone-300 border-dashed rounded-lg cursor-pointer text-xs font-semibold text-stone-700 active:scale-95 transition-all">
              <i class="fa-solid fa-image text-stone-400"></i>
              <span id="label-cover-filename" class="truncate max-w-[200px]">사진 선택 (앨범 / 파일)</span>
              <input type="file" id="file-cover-input" accept="image/*,.jpg,.jpeg,.png,.webp,.gif,.heic,.heif" class="hidden">
            </label>
          </div>

          <div id="panel-cover-text" class="space-y-1.5">
            <div class="flex items-center gap-1.5 flex-wrap px-0.5">
              <button type="button" class="color-swatch w-5 h-5 rounded-full border border-stone-200 shadow-sm" style="background-color: #FFE5E5;" data-hex="#FFE5E5"></button>
              <button type="button" class="color-swatch w-5 h-5 rounded-full border border-stone-200 shadow-sm" style="background-color: #FFEBD9;" data-hex="#FFEBD9"></button>
              <button type="button" class="color-swatch w-5 h-5 rounded-full border border-stone-300 shadow-sm ring-2 ring-stone-700" style="background-color: #FFF6D6;" data-hex="#FFF6D6"></button>
              <button type="button" class="color-swatch w-5 h-5 rounded-full border border-stone-200 shadow-sm" style="background-color: #E8F8EC;" data-hex="#E8F8EC"></button>
              <button type="button" class="color-swatch w-5 h-5 rounded-full border border-stone-200 shadow-sm" style="background-color: #E5F2FC;" data-hex="#E5F2FC"></button>
              <button type="button" class="color-swatch w-5 h-5 rounded-full border border-stone-200 shadow-sm" style="background-color: #EAE8FB;" data-hex="#EAE8FB"></button>
              <button type="button" class="color-swatch w-5 h-5 rounded-full border border-stone-200 shadow-sm" style="background-color: #F3E8FA;" data-hex="#F3E8FA"></button>
              <button type="button" class="color-swatch w-5 h-5 rounded-full border border-stone-200 shadow-sm" style="background-color: #FFE8F0;" data-hex="#FFE8F0"></button>

              <label class="w-5 h-5 rounded-full border border-stone-300 shadow-sm cursor-pointer flex items-center justify-center bg-white relative overflow-hidden active:scale-95 ml-0.5">
                <i class="fa-solid fa-eye-dropper text-[9px] text-stone-500"></i>
                <input type="color" id="custom-color-picker" value="#FFF6D6" class="absolute -top-4 -left-4 w-12 h-12 opacity-0 cursor-pointer">

            </div>

            <input type="text" id="selected-card-icon" value="🌟" placeholder="이모지 직접 입력"

          </div>

          <div class="flex items-center justify-center pt-2">
            <div id="tile-preview-box" class="w-16 h-16 rounded-xl border border-stone-200 shadow-sm overflow-hidden flex flex-col items-center justify-center p-1 relative transition-all" style="background-color: #FFF6D6;">
              <div id="preview-text-content" class="flex flex-col items-center justify-center w-full h-full">

                <span id="tile-preview-text" class="text-[9px] font-bold text-stone-800 text-center truncate max-w-full mt-0.5">미리보기</span>
              </div>
              <img id="preview-img-content" src="" alt="미리보기" class="hidden w-full h-full object-cover rounded-lg pointer-events-none">
            </div>
          </div>
        </div>

        <div>
          <div class="grid grid-cols-3 gap-1 mb-1.5">
            <button type="button" id="tab-src-file" class="py-1 text-[11px] font-bold rounded-lg border bg-stone-100 border-stone-200 text-stone-800 flex items-center justify-center transition-colors">

            <button type="button" id="tab-src-yt" class="py-1 text-[11px] font-bold rounded-lg border bg-stone-50 border-stone-200 text-stone-600 flex items-center justify-center transition-colors">

            <button type="button" id="tab-src-url" class="py-1 text-[11px] font-bold rounded-lg border bg-stone-50 border-stone-200 text-stone-600 flex items-center justify-center transition-colors">
              링크
            </button>
          </div>

          <div id="panel-src-file">
            <label class="flex items-center justify-center gap-2 w-full py-2.5 px-3 bg-stone-50 hover:bg-stone-100 border border-stone-300 border-dashed rounded-lg cursor-pointer text-xs font-semibold text-stone-700 active:scale-95 transition-all">

              <span id="label-audio-filename" class="truncate max-w-[200px]">음원 파일 선택 (MP3, M4A 등)</span>
              <input type="file" id="file-audio-input" accept=".mp3,.m4a,.wav,.aac,.flac,.ogg,audio/*" class="hidden">
            </label>
          </div>

          <div id="panel-src-yt" class="hidden">
            <input type="text" id="input-yt-url" placeholder="유튜브 링크"
                   class="w-full px-2 py-1.5 text-xs rounded-lg border border-stone-200 bg-stone-50 focus:outline-none font-medium">
          </div>

          <div id="panel-src-url" class="hidden">
            <input type="text" id="input-stream-url" placeholder="음원 주소"
                   class="w-full px-2 py-1.5 text-xs rounded-lg border border-stone-200 bg-stone-50 focus:outline-none font-medium">
          </div>
        </div>

        <button id="btn-submit-card" class="w-full py-1.5 rounded-lg bg-[#EFE8DC] hover:bg-[#E5DDCF] active:scale-95 text-stone-800 font-bold text-xs border border-[#DFD6C7] transition-all flex items-center justify-center gap-1">
          <i id="submit-icon" class="fa-solid fa-plus text-xs"></i> <span id="ui-btn-add">추가</span>
        </button>
      </div>

      <!-- Category Management -->

    localAudio.onplay = () => {

    localAudio.onpause = () => {

      }

    localAudio.onended = () => {

    function unlockAudioEngine() {
      initAudioContext();
      if (!localAudio.src) {
        try {
          localAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==';
          localAudio.load();
        } catch(e) {}
      }
    }
    document.addEventListener('touchstart', unlockAudioEngine, { once: true, passive: true });
    document.addEventListener('click', unlockAudioEngine, { once: true });

    function updateMediaSessionInfo(card) {
      if (!('mediaSession' in navigator) || !window.MediaMetadata) return;

      try {
        if (!card) {
          navigator.mediaSession.metadata = null;
          navigator.mediaSession.playbackState = 'none';
          return;
        }

        const t = I18N[currentUiLang] || I18N.ko;
        const artworkList = [];

        if (card.coverUrl && (card.coverUrl.startsWith('http://') || card.coverUrl.startsWith('https://'))) {
          artworkList.push({ src: card.coverUrl, sizes: '512x512', type: 'image/png' });
        }

        navigator.mediaSession.metadata = new MediaMetadata({
          title: card.title || '베베오디오',
          artist: '엄마의 사운드북',
          album: t.audioAlbumName || '베베오디오',
          artwork: artworkList
        });

        const safeSetAction = (action, handler) => {
          try { navigator.mediaSession.setActionHandler(action, handler); } catch(e) {}
        };

        safeSetAction('play', () => { if (localAudio.src) localAudio.play().catch(()=>{}); });
        safeSetAction('pause', () => { localAudio.pause(); });
        safeSetAction('stop', () => { stopPlayback(true); });
        safeSetAction('nexttrack', () => { playNextInPlaylist(); });
        safeSetAction('previoustrack', () => {
          if (currentPlaylist.length > 0) {
            currentPlaylistIndex = (currentPlaylistIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
            playSong(currentPlaylist[currentPlaylistIndex]);
          }
        });
      } catch(err) {
        console.warn('MediaSession error', err);
      }
    }

    function initAudioContext() {
      if (!audioCtx) {
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        if (AudioCtxClass) {
          audioCtx = new AudioCtxClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function initDB() {
      return new Promise((resolve) => {
        try {
          const request = indexedDB.open('BabySoundDB', 1);
          request.onupgradeneeded = (e) => {
            const database = e.target.result;
            if (!database.objectStoreNames.contains('audioFiles')) {
              database.createObjectStore('audioFiles', { keyPath: 'id' });
            }
          };
          request.onsuccess = (e) => {
            db = e.target.result;
            resolve(db);
          };
          request.onerror = () => resolve(null);
        } catch(e) {
          resolve(null);
        }
      });
    }

    async function saveAudioToDB(id, blobOrFile) {
      if (audioBlobCache.has(id)) {
        try { URL.revokeObjectURL(audioBlobCache.get(id)); } catch(e){}
      }
      const url = URL.createObjectURL(blobOrFile);
      audioBlobCache.set(id, url);

      if (!db) return;
      try {
        const base64 = await blobToBase64(blobOrFile);
        const tx = db.transaction('audioFiles', 'readwrite');
        const store = tx.objectStore('audioFiles');
        store.put({ id, blob: blobOrFile, data: base64, type: blobOrFile.type });
        return new Promise((resolve) => {
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        });
      } catch(e) {}
    }

    function getAudioFromDB(id) {
      if (!db) return Promise.resolve(null);
      return new Promise((resolve) => {
        try {
          const tx = db.transaction('audioFiles', 'readonly');
          const store = tx.objectStore('audioFiles');
          const request = store.get(id);
          request.onsuccess = () => {
            if (!request.result) return resolve(null);
            const item = request.result;
            if (item.blob instanceof Blob) {
              resolve(item.blob);
            } else if (item.data) {
              resolve(base64ToBlob(item.data));
            } else {
              resolve(null);
            }
          };
          request.onerror = () => resolve(null);
        } catch(e) {
          resolve(null);
        }
      });
    }

    function deleteAudioFromDB(id) {
      if (audioBlobCache.has(id)) {
        try { URL.revokeObjectURL(audioBlobCache.get(id)); } catch(e){}
        audioBlobCache.delete(id);
      }
      if (!db) return Promise.resolve();
      return new Promise((resolve) => {
        try {
          const tx = db.transaction('audioFiles', 'readwrite');
          const store = tx.objectStore('audioFiles');
          store.delete(id);
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        } catch(e) {
          resolve();
        }
      });
    }

    async function preloadAllAudioBlobs() {
      for (const card of cards) {
        if (card.audioType === 'file' && !audioBlobCache.has(card.id)) {
          const blob = await getAudioFromDB(card.id);
          if (blob) {
            audioBlobCache.set(card.id, URL.createObjectURL(blob));
          }
        }
      }
    }

    function blobToBase64(blob) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result || '');
        reader.onerror = () => resolve('');
        reader.readAsDataURL(blob);
      });
    }

    function base64ToBlob(base64Data) {
      try {
        const parts = base64Data.split(';base64,');
        const contentType = parts[0].split(':')[1] || 'audio/mpeg';
        const raw = window.atob(parts[1]);
        const rawLength = raw.length;
        const uInt8Array = new Uint8Array(rawLength);
        for (let i = 0; i < rawLength; ++i) {
          uInt8Array[i] = raw.charCodeAt(i);
        }
        return new Blob([uInt8Array], { type: contentType });
      } catch(e) {
        return new Blob([], { type: 'audio/mpeg' });
      }
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result || '');
        reader.onerror = () => resolve('');
        reader.readAsDataURL(file);
      });
    }

      renderAddModalCategoryBubbles();
      updateCategorySelectOptions();
      renderModalCardList();
      renderModalCategoryTags();
      renderFilterChips();
    }

    document.getElementById('btn-ui-lang-ko').addEventListener('click', () => setUiLanguage('ko'));
    document.getElementById('btn-ui-lang-en').addEventListener('click', () => setUiLanguage('en'));

    const quickTimerPopover = document.getElementById('quick-timer-popover');
    const btnTimerQuick = document.getElementById('btn-timer-quick');
    const inputQuickTimer = document.getElementById('input-quick-timer');

    btnTimerQuick.addEventListener('click', (e) => {
      e.stopPropagation();
      quickTimerPopover.classList.toggle('hidden');
      if (!quickTimerPopover.classList.contains('hidden')) {
        inputQuickTimer.value = timerMinutes > 0 ? timerMinutes : '';
        inputQuickTimer.focus();
      }
    });

    document.addEventListener('click', (e) => {
      if (!quickTimerPopover.contains(e.target) && e.target !== btnTimerQuick && !btnTimerQuick.contains(e.target)) {
        quickTimerPopover.classList.add('hidden');
      }
    });

    document.getElementById('btn-quick-timer-apply').addEventListener('click', () => {
      const val = parseInt(inputQuickTimer.value, 10);
      setTimerMinutes(isNaN(val) || val < 0 ? 0 : val);
      quickTimerPopover.classList.add('hidden');
    });

    document.getElementById('btn-quick-timer-off').addEventListener('click', () => {
      setTimerMinutes(0);
      quickTimerPopover.classList.add('hidden');
    });

    document.querySelectorAll('.btn-timer-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = parseInt(btn.dataset.min, 10);
        setTimerMinutes(val);
        quickTimerPopover.classList.add('hidden');
      });
    });

    function setTimerMinutes(mins) {
      timerMinutes = mins;
      if (timerTimeoutId) {
        clearTimeout(timerTimeoutId);
        timerTimeoutId = null;
      }
      if (timerIntervalId) {
        clearInterval(timerIntervalId);
        timerIntervalId = null;
      }

      if (timerMinutes > 0) {
        timerEndTime = Date.now() + timerMinutes * 60 * 1000;
        timerIntervalId = setInterval(tickTimer, 1000);
        timerTimeoutId = setTimeout(() => {
          stopPlayback(true);
        }, timerMinutes * 60 * 1000);
      } else {
        timerEndTime = null;
      }
      updateTimerUI();
    }

    function tickTimer() {
      if (!timerEndTime) return;
      const remainingMs = timerEndTime - Date.now();
      if (remainingMs <= 0) {
        if (timerIntervalId) clearInterval(timerIntervalId);
        timerIntervalId = null;
        timerEndTime = null;
        timerMinutes = 0;
        hideVisualTimer();
        updateTimerUI();
      } else {
        updateTimerUI();
        updateVisualTimer(remainingMs);
      }
    }

    function updateVisualTimer(remainingMs) {
      const container = document.getElementById('visual-timer-container');
      const disk = document.getElementById('visual-timer-disk');
      const secondsLabel = document.getElementById('visual-timer-seconds');
      const textLabel = document.getElementById('visual-timer-label');
      
      const remainingSec = Math.max(0, Math.ceil(remainingMs / 1000));

      if (remainingSec <= 60 && remainingSec > 0) {
        container.classList.remove('hidden');
        secondsLabel.textContent = remainingSec;
        if (textLabel) {
          textLabel.textContent = currentUiLang === 'en' ? 'Music ending soon' : '곧 노래가 끝나요';
        }

        const angle = (remainingSec / 60) * 360;
        disk.style.background = `conic-gradient(from 0deg, #F87171 0deg, #EF4444 ${angle}deg, transparent ${angle}deg 360deg)`;
      } else {
        hideVisualTimer();
      }
    }

    function hideVisualTimer() {
      const container = document.getElementById('visual-timer-container');
      if (container) {
        container.classList.add('hidden');
      }
    }

    function onTilePress(card) {
      unlockAudioEngine();
      const now = Date.now();

      // 연타 방지: 같은 노래뿐만 아니라 어떤 노래든 재생 시작 후 쿨다운 시간(초) 동안은 인터럽트 방지
      if (currentPlaying) {
        const elapsed = (now - playingStartTime) / 1000;
        if (elapsed < cooldownSec) {
          return;
        }
      }

      currentRepeatCount = 0;

      if (repeatMode === 'all' || isShuffleActive || playbackMode === 'sequential') {
        const list = getFilteredCards();
        currentPlaylist = isShuffleActive ? [...list].sort(() => Math.random() - 0.5) : list;
        const idx = currentPlaylist.findIndex(c => c.id === card.id);
        currentPlaylistIndex = (idx !== -1) ? idx : 0;
      }

      playSong(card);
    }

    function formatAudioStreamUrl(rawUrl) {
      if (!rawUrl) return '';
      if (rawUrl.includes('drive.google.com')) {
        const match = rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (match && match[1]) {
          return `https://drive.google.com/uc?export=download&id=${match[1]}`;
        }
      }
      return rawUrl;
    }

    function playSong(card) {
      stopAudioEngine();

      currentPlaying = card;
      playingStartTime = Date.now();
      updateTileStyles();
      updateMediaSessionInfo(card);

      if (timerMinutes > 0 && !timerTimeoutId) {
        timerTimeoutId = setTimeout(() => {
          stopPlayback(true);
        }, timerMinutes * 60 * 1000);
      }

      if (card.audioType === 'file') {
        let blobUrl = audioBlobCache.get(card.id);
        if (blobUrl) {
          playNativeAudio(blobUrl);
          return;
        } else {
          getAudioFromDB(card.id).then(blob => {
            if (blob) {
              blobUrl = URL.createObjectURL(blob);
              audioBlobCache.set(card.id, blobUrl);
              playNativeAudio(blobUrl);
            }
          });
          return;
        }
      }

      if (card.audioType === 'url' && card.streamUrl) {
        const finalUrl = formatAudioStreamUrl(card.streamUrl);
        playNativeAudio(finalUrl);
        return;
      }

      if (card.audioType === 'youtube' && card.ytId && isYtReady && ytPlayer) {
        try {
          ytPlayer.loadVideoById(card.ytId);
          ytPlayer.playVideo();
          return;
        } catch (e) {}
      }
    }

    function playNativeAudio(srcUrl) {
      try {
        localAudio.src = srcUrl;
        localAudio.load();
        const p = localAudio.play();
        if (p && p.catch) {
          p.catch(err => {
            console.warn('Native audio play error:', err);
          });
        }
      } catch(e) {}
    }

    function onTrackEnded() {
      if (repeatMode === 'one' && currentPlaying) {
        currentRepeatCount++;
        if (repeatCountLimit > 0 && currentRepeatCount >= repeatCountLimit) {
          currentRepeatCount = 0;
          stopPlayback(false);
          return;
        }
        playSong(currentPlaying);
        return;
      }

      if (repeatMode === 'all' || isShuffleActive || playbackMode === 'sequential') {
        playNextInPlaylist();
      } else {
        stopAudioEngine();
        currentPlaying = null;
        updateTileStyles();
        updateMediaSessionInfo(null);
      }
    }

    function playNextInPlaylist() {
      if (!currentPlaylist.length) {
        const list = getFilteredCards();
        if (!list.length) return;
        currentPlaylist = isShuffleActive ? [...list].sort(() => Math.random() - 0.5) : list;
        currentPlaylistIndex = 0;
      } else {
        currentPlaylistIndex = (currentPlaylistIndex + 1) % currentPlaylist.length;
      }

      const nextCard = currentPlaylist[currentPlaylistIndex];
      const filtered = getFilteredCards();
      const nextIndexInFiltered = filtered.findIndex(c => c.id === nextCard.id);
      if (nextIndexInFiltered !== -1) {
        const targetPage = Math.floor(nextIndexInFiltered / CARDS_PER_PAGE) + 1;
        if (targetPage !== currentPage) {
          flipPage(targetPage > currentPage ? 'forward' : 'backward', targetPage);
        }
      }

      playSong(nextCard);
    }

    function stopAudioEngine() {
      try {
        localAudio.pause();
        if (localAudio.readyState > 0) {
          localAudio.currentTime = 0;
        }
      } catch(e){}

      if (isYtReady && ytPlayer && ytPlayer.stopVideo) {
        try { ytPlayer.stopVideo(); } catch(e){}
      }
    }

    function stopPlayback(isManualStop = false) {
      currentPlaying = null;
      stopAudioEngine();
      updateMediaSessionInfo(null);

      if (timerTimeoutId) {
        clearTimeout(timerTimeoutId);
        timerTimeoutId = null;
      }
      if (timerIntervalId) {
        clearInterval(timerIntervalId);
        timerIntervalId = null;
      }
      timerEndTime = null;
      timerMinutes = 0;

      hideVisualTimer();
      currentRepeatCount = 0;

      if (isManualStop && playbackMode === 'sequential') {
        playbackMode = 'single';
      }

      updateControlButtons();
      updateTileStyles();
      updateTimerUI();
    }

    function cardHasCategory(card, categoryObj) {
      if (!card || !categoryObj) return false;
      const cats = Array.isArray(card.categories) ? card.categories : (card.theme ? [card.theme] : []);
      const hasId = cats.includes(categoryObj.id);
      const hasName = categoryObj.name && cats.includes(categoryObj.name);
      return hasId || Boolean(hasName);
    }

    function getFilteredCards() {
      if (activeFilter === 'all') return cards;
      const targetCat = categories.find(c => c.id === activeFilter);
      return cards.filter(c => {
        if (!c) return false;
        if (targetCat) {
          return cardHasCategory(c, targetCat);
        }
        const cats = Array.isArray(c.categories) ? c.categories : (c.theme ? [c.theme] : []);
        return cats.includes(activeFilter);
      });
    }

    function getPageCards(pageNum) {
      const filtered = getFilteredCards();
      const start = (pageNum - 1) * CARDS_PER_PAGE;
      return filtered.slice(start, start + CARDS_PER_PAGE);
    }

    function flipPage(direction, targetPageNumber) {
      if (isPageFlipping) return;
      const filtered = getFilteredCards();
      const totalPages = Math.max(1, Math.ceil(filtered.length / CARDS_PER_PAGE));
      if (targetPageNumber < 1 || targetPageNumber > totalPages) return;

      isPageFlipping = true;
      const stage = document.getElementById('book-stage');
      const activeSheet = document.getElementById('active-sheet');
      const underSheet = document.getElementById('under-sheet');
      const underGrid = underSheet.querySelector('.under-grid');

      if (direction === 'forward') {
        populateGridCards(underGrid, getPageCards(targetPageNumber));
        activeSheet.className = 'songbook-sheet flex items-stretch z-20 sheet-slide-out-left';

        currentPage = targetPageNumber;
        updatePaginationControls(totalPages);

        setTimeout(() => {
          const activeGrid = document.getElementById('active-grid');
          populateGridCards(activeGrid, getPageCards(currentPage));
          activeSheet.className = 'songbook-sheet flex items-stretch z-20';
          isPageFlipping = false;
        }, 850);
      } else {
        const incomingSheet = underSheet.cloneNode(true);
        incomingSheet.removeAttribute('id');
        populateGridCards(incomingSheet.querySelector('.under-grid'), getPageCards(targetPageNumber));
        incomingSheet.className = 'songbook-sheet flex items-stretch z-30 sheet-slide-in-from-left';
        stage.appendChild(incomingSheet);

        currentPage = targetPageNumber;
        updatePaginationControls(totalPages);

        setTimeout(() => {
          const activeGrid = document.getElementById('active-grid');
          populateGridCards(activeGrid, getPageCards(currentPage));
          incomingSheet.remove();
          isPageFlipping = false;
        }, 850);
      }
    }

    function renderPage() {
      const filtered = getFilteredCards();
      const totalPages = Math.max(1, Math.ceil(filtered.length / CARDS_PER_PAGE));
      if (currentPage > totalPages) currentPage = totalPages;

      const pageCards = getPageCards(currentPage);
      const activeGrid = document.getElementById('active-grid');
      populateGridCards(activeGrid, pageCards);
      updatePaginationControls(totalPages);
    }

    function populateGridCards(gridContainer, pageCards) {
      gridContainer.innerHTML = '';

      pageCards.forEach(card => {
        const isPlaying = currentPlaying && currentPlaying.id === card.id;
        const tile = document.createElement('button');
        tile.id = `tile-${card.id}`;
        tile.className = `soundbook-tile relative w-full h-full rounded-2xl overflow-hidden border border-stone-200/80 flex flex-col items-center justify-center p-2 select-none focus:outline-none ${
          isPlaying ? 'is-playing' : ''
        }`;

        if (card.coverType === 'image' && card.coverUrl) {
          tile.style.backgroundColor = '#FFFFFF';
          tile.innerHTML = `
            <img src="${card.coverUrl}" alt="${card.title}" class="w-full h-full object-cover rounded-xl pointer-events-none" onerror="this.src='https://placehold.co/400x400/FAF3DF/786B59?text=📖'">
            <div class="note-badge absolute top-1.5 right-1.5 w-6 h-6 rounded-full bg-white/95 shadow-sm flex items-center justify-center text-xs text-amber-700 ${isPlaying ? '' : 'hidden'}">
              🎵
            </div>
          `;
        } else {
          const hexCol = card.bgColorHex || '#FFF6D6';
          const icon = card.icon || '🌟';
          tile.style.backgroundColor = hexCol;
          tile.innerHTML = `
            <div class="text-4xl sm:text-5xl mb-1 pointer-events-none drop-shadow-sm select-none">${icon}</div>
            <div class="text-xs sm:text-sm font-extrabold text-stone-800 text-center leading-snug line-clamp-2 px-1 pointer-events-none">
              ${card.title}
            </div>
            <div class="note-badge absolute top-1.5 right-1.5 w-6 h-6 rounded-full bg-white/95 shadow-sm flex items-center justify-center text-xs text-amber-700 ${isPlaying ? '' : 'hidden'}">
              🎵
            </div>
          `;
        }

        tile.addEventListener('click', () => onTilePress(card));
        gridContainer.appendChild(tile);
      });

      for (let i = pageCards.length; i < CARDS_PER_PAGE; i++) {
        const emptySlot = document.createElement('div');
        emptySlot.className = 'w-full h-full rounded-2xl border-2 border-dashed border-stone-200/60 bg-stone-100/20 flex flex-col items-center justify-center';
        emptySlot.innerHTML = `
          <span class="text-stone-300 text-xl font-bold">🌱</span>
        `;
        gridContainer.appendChild(emptySlot);
      }
    }

    function updateTileStyles() {
      const tiles = document.querySelectorAll('.soundbook-tile');
      tiles.forEach(tile => {
        const cardId = tile.id.replace('tile-', '');
        const isCurrent = currentPlaying && currentPlaying.id === cardId;
        const badge = tile.querySelector('.note-badge');

        if (isCurrent) {
          tile.classList.add('is-playing');
          if (badge) badge.classList.remove('hidden');
        } else {
          tile.classList.remove('is-playing');
          if (badge) badge.classList.add('hidden');
        }
      });
    }

    function updateControlButtons() {
      const shuffleBtn = document.getElementById('btn-shuffle');
      const playAllBtn = document.getElementById('btn-play-all');
      const repeatBtn = document.getElementById('btn-repeat-mode');
      const repeatIcon = document.getElementById('repeat-icon');
      const repeatBadge = document.getElementById('repeat-badge');

      if (isShuffleActive) {
        shuffleBtn.className = 'w-8 h-8 rounded-full bg-[#E5DDCF] text-stone-900 font-black shadow-sm ring-2 ring-[#DFD6C7] flex items-center justify-center text-xs active:scale-95 transition-all';
      } else {
        shuffleBtn.className = 'w-8 h-8 rounded-full bg-white/90 text-stone-700 shadow-sm border border-stone-200 flex items-center justify-center text-xs active:scale-95 transition-all';
      }

      if (playbackMode === 'sequential') {
        playAllBtn.className = 'w-8 h-8 rounded-full bg-[#E5DDCF] text-stone-900 font-black shadow-sm ring-2 ring-[#DFD6C7] flex items-center justify-center text-xs active:scale-95 transition-all';
      } else {
        playAllBtn.className = 'w-8 h-8 rounded-full bg-white/90 text-stone-700 shadow-sm border border-stone-200 flex items-center justify-center text-xs active:scale-95 transition-all';
      }

      if (repeatMode === 'one') {
        repeatBtn.className = 'w-8 h-8 rounded-full bg-[#E5DDCF] text-stone-900 font-black shadow-sm ring-2 ring-[#DFD6C7] flex items-center justify-center text-xs active:scale-95 transition-all relative';
        repeatIcon.className = 'fa-solid fa-repeat text-amber-800 text-[11px]';
        repeatBadge.textContent = repeatCountLimit > 0 ? `${repeatCountLimit}` : '1';
        repeatBadge.classList.remove('hidden');
      } else if (repeatMode === 'all') {
        repeatBtn.className = 'w-8 h-8 rounded-full bg-[#E5DDCF] text-stone-900 font-black shadow-sm ring-2 ring-[#DFD6C7] flex items-center justify-center text-xs active:scale-95 transition-all relative';
        repeatIcon.className = 'fa-solid fa-repeat text-stone-800 text-[11px]';
        repeatBadge.classList.add('hidden');
      } else {
        repeatBtn.className = 'w-8 h-8 rounded-full bg-white/90 text-stone-700 shadow-sm border border-stone-200 flex items-center justify-center text-xs active:scale-95 transition-all relative';
        repeatIcon.className = 'fa-solid fa-arrow-right text-[11px] text-stone-500';
        repeatBadge.classList.add('hidden');
      }
    }

    document.getElementById('btn-repeat-mode').addEventListener('click', () => {
      currentRepeatCount = 0;
      if (repeatMode === 'off') {
        repeatMode = 'one';
      } else if (repeatMode === 'one') {
        repeatMode = 'all';
      } else {
        repeatMode = 'off';
      }
      updateControlButtons();
    });

    const customTimerInput = document.getElementById('input-custom-timer');
    customTimerInput.addEventListener('input', () => {
      const val = parseInt(customTimerInput.value, 10);
      setTimerMinutes(isNaN(val) || val < 0 ? 0 : val);
    });

    function updateTimerUI() {
      const t = I18N[currentUiLang] || I18N.ko;
      const badge = document.getElementById('timer-status-badge');
      const quickBadge = document.getElementById('quick-timer-badge');
      const quickStatus = document.getElementById('quick-timer-status');
      const quickIconBtn = document.getElementById('btn-timer-quick');

      if (!timerEndTime || timerMinutes === 0) {
        if (badge) {
          badge.textContent = t.timerOff;
          badge.className = 'text-[10px] text-stone-600 font-bold bg-stone-100 px-1.5 py-0.5 rounded';
        }
        if (quickStatus) {
          quickStatus.textContent = t.timerOff;
          quickStatus.className = 'text-[10px] text-stone-600 font-bold bg-stone-100 px-1.5 py-0.5 rounded';
        }
        if (quickBadge) quickBadge.classList.add('hidden');
        if (quickIconBtn) {
          quickIconBtn.className = 'w-8 h-8 rounded-full bg-white/90 text-stone-700 shadow-sm border border-stone-200 flex items-center justify-center text-xs active:scale-95 transition-all relative';
        }
      } else {
        const remainingSec = Math.max(0, Math.ceil((timerEndTime - Date.now()) / 1000));
        let displayRemaining = '';
        if (remainingSec >= 60) {
          const m = Math.ceil(remainingSec / 60);
          displayRemaining = `${m}${t.timerUnit}`;
        } else {
          displayRemaining = `${remainingSec}s`;
        }

        if (badge) {
          badge.textContent = displayRemaining;
          badge.className = 'text-[10px] text-amber-800 font-bold bg-amber-100 px-1.5 py-0.5 rounded';
        }
        if (quickStatus) {
          quickStatus.textContent = displayRemaining;
          quickStatus.className = 'text-[10px] text-amber-800 font-bold bg-amber-100 px-1.5 py-0.5 rounded';
        }
        if (quickBadge) {
          quickBadge.textContent = displayRemaining;
          quickBadge.classList.remove('hidden');
        }
        if (quickIconBtn) {
          quickIconBtn.className = 'w-8 h-8 rounded-full bg-[#E5DDCF] text-amber-900 font-bold shadow-sm ring-2 ring-[#DFD6C7] flex items-center justify-center text-xs active:scale-95 transition-all relative';
        }
      }
    }

    const customRepeatInput = document.getElementById('input-custom-repeat');
    if (customRepeatInput) {
      customRepeatInput.addEventListener('input', () => {
        const val = parseInt(customRepeatInput.value, 10);
        repeatCountLimit = isNaN(val) || val < 0 ? 0 : val;
        currentRepeatCount = 0;
        updateRepeatLimitUI();
        updateControlButtons();
        saveLocalData();
      });
    }

    document.querySelectorAll('.btn-repeat-limit-opt').forEach(btn => {
      btn.addEventListener('click', () => {
        repeatCountLimit = parseInt(btn.dataset.count, 10);
        currentRepeatCount = 0;
        updateRepeatLimitUI();
        updateControlButtons();
        saveLocalData();
      });
    });

    function updateRepeatLimitUI() {
      const t = I18N[currentUiLang] || I18N.ko;
      const badge = document.getElementById('repeat-limit-badge');
      if (repeatCountLimit === 0) {
        badge.textContent = t.unlimited;
      } else {
        badge.textContent = `${repeatCountLimit}${t.countUnit}`;
      }

      const repeatInputEl = document.getElementById('input-custom-repeat');
      if (repeatInputEl && document.activeElement !== repeatInputEl) {
        repeatInputEl.value = repeatCountLimit > 0 ? repeatCountLimit : '';
      }

      document.querySelectorAll('.btn-repeat-limit-opt').forEach(btn => {
        const val = parseInt(btn.dataset.count, 10);
        if (val === repeatCountLimit) {
          btn.className = 'btn-repeat-limit-opt py-1 text-[11px] font-bold rounded-lg border bg-stone-200 border-stone-400 text-stone-900 shadow-sm';
        } else {
          btn.className = 'btn-repeat-limit-opt py-1 text-[11px] font-bold rounded-lg border bg-stone-50 border-stone-200 text-stone-600';
        }
      });
    }

    document.getElementById('btn-prev-page').addEventListener('click', () => {
      if (currentPage > 1) {
        flipPage('backward', currentPage - 1);
      }
    });

    document.getElementById('btn-next-page').addEventListener('click', () => {
      const filtered = getFilteredCards();
      const totalPages = Math.ceil(filtered.length / CARDS_PER_PAGE);
      if (currentPage < totalPages) {
        flipPage('forward', currentPage + 1);
      }
    });

    document.getElementById('btn-shuffle').addEventListener('click', () => {
      unlockAudioEngine();
      const list = getFilteredCards();
      if (!list.length) return;

      isShuffleActive = !isShuffleActive;
      if (isShuffleActive) {
        currentPlaylist = [...list].sort(() => Math.random() - 0.5);
        currentPlaylistIndex = 0;
        updateControlButtons();
        playSong(currentPlaylist[0]);
      } else {
        updateControlButtons();
      }
    });

    document.getElementById('btn-play-all').addEventListener('click', () => {
      unlockAudioEngine();
      const list = getFilteredCards();
      if (!list.length) return;

      if (playbackMode === 'sequential') {
        playbackMode = 'single';
        updateControlButtons();
        return;
      }
      playbackMode = 'sequential';
      currentPlaylist = isShuffleActive ? [...list].sort(() => Math.random() - 0.5) : list;
      currentPlaylistIndex = 0;
      updateControlButtons();
      playSong(currentPlaylist[0]);
    });

    document.getElementById('btn-stop-all').addEventListener('click', () => {
      stopPlayback(true);
    });

    function renderFilterChips() {
      const container = document.getElementById('filter-chip-container');
      container.innerHTML = '';

      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.dataset.filter = cat.id;
        const isActive = activeFilter === cat.id;
        btn.className = `filter-chip h-8 px-2.5 rounded-full text-xs font-bold shadow-sm flex-shrink-0 border flex items-center gap-1 transition-all ${
          isActive 
            ? 'bg-[#EFE8DC] text-stone-900 font-extrabold border-[#DFD6C7] ring-1 ring-[#DFD6C7]' 
            : 'bg-white/85 text-stone-700 border-stone-200'
        }`;
        
        let labelText = '';
        if (cat.id !== 'all' && cat.name) {
          labelText = `<span class="truncate max-w-[64px]">${cat.name}</span>`;
        }

        btn.innerHTML = `<span>${cat.icon || '🔖'}</span>${labelText}`;

        btn.addEventListener('click', () => {
          activeFilter = cat.id;
          currentPage = 1;
          renderFilterChips();
          renderPage();
        });

        container.appendChild(btn);
      });
    }

    let touchStartX = 0;
    const stageArea = document.getElementById('book-stage');
    stageArea.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    stageArea.addEventListener('touchend', e => { handleSwipe(e.changedTouches[0].clientX - touchStartX); });
    stageArea.addEventListener('mousedown', e => { touchStartX = e.clientX; });
    stageArea.addEventListener('mouseup', e => { handleSwipe(e.clientX - touchStartX); });

    function handleSwipe(deltaX) {
      if (isPageFlipping) return;
      const filtered = getFilteredCards();
      const totalPages = Math.ceil(filtered.length / CARDS_PER_PAGE);
      if (deltaX < -45 && currentPage < totalPages) {
        flipPage('forward', currentPage + 1);
      } else if (deltaX > 45 && currentPage > 1) {
        flipPage('backward', currentPage - 1);
      }
    }

    function updatePaginationControls(totalPages) {
      document.getElementById('page-text').textContent = `${currentPage} / ${Math.max(1, totalPages)}`;
      document.getElementById('btn-prev-page').disabled = currentPage <= 1;
      document.getElementById('btn-next-page').disabled = currentPage >= totalPages || totalPages === 0;

      const dotsContainer = document.getElementById('page-dots');
      dotsContainer.innerHTML = '';
      const displayPages = Math.max(1, totalPages);
      for (let i = 1; i <= displayPages; i++) {
        const dot = document.createElement('div');
        dot.className = `w-2 h-2 rounded-full transition-all ${
          i === currentPage ? 'bg-stone-500 w-4' : 'bg-stone-300'
        }`;
        dotsContainer.appendChild(dot);
      }
    }

    // Edit Item Handlers
    function startEditCard(card) {
      editingCardId = card.id;
      const t = I18N[currentUiLang] || I18N.ko;

      document.getElementById('card-editor-card').scrollIntoView({ behavior: 'smooth' });
      document.getElementById('ui-label-new-item').textContent = t.editItem;
      document.getElementById('ui-btn-add').textContent = t.saveBtn;
      document.getElementById('submit-icon').className = 'fa-solid fa-check text-xs';
      document.getElementById('btn-cancel-edit').classList.remove('hidden');

      document.getElementById('new-title').value = card.title || '';
      selectedAddCategoryIds = Array.isArray(card.categories) ? [...card.categories] : (card.theme ? [card.theme] : []);
      renderAddModalCategoryBubbles();

      if (card.coverType === 'image') {
        setCoverMode('image');
        currentCoverPhotoDataUrl = card.coverUrl || '';
        document.getElementById('label-cover-filename').textContent = '📷 등록된 사진 유지 중 (터치 시 변경)';
      } else {
        setCoverMode('text');
        selectColor(card.bgColorHex || '#FFF6D6');
        document.getElementById('selected-card-icon').value = card.icon || '🌟';
      }

      setAudioSourceType(card.audioType || 'file');
      if (card.audioType === 'youtube') {
        document.getElementById('input-yt-url').value = card.ytId ? `https://youtu.be/${card.ytId}` : '';
      } else if (card.audioType === 'url') {
        document.getElementById('input-stream-url').value = card.streamUrl || '';
      } else {
        document.getElementById('label-audio-filename').textContent = '🎵 등록된 음원 유지 중 (터치 시 변경)';
      }

      updateTilePreview();
    }

    function cancelEditMode() {
      editingCardId = null;
      const t = I18N[currentUiLang] || I18N.ko;

      document.getElementById('ui-label-new-item').textContent = t.newItem;
      document.getElementById('ui-btn-add').textContent = t.addBtn;
      document.getElementById('submit-icon').className = 'fa-solid fa-plus text-xs';
      document.getElementById('btn-cancel-edit').classList.add('hidden');

      document.getElementById('new-title').value = '';
      document.getElementById('input-yt-url').value = '';
      document.getElementById('input-stream-url').value = '';
      document.getElementById('file-audio-input').value = '';
      document.getElementById('file-cover-input').value = '';

      document.getElementById('label-cover-filename').textContent = t.selectPhoto;
      document.getElementById('label-audio-filename').textContent = t.selectAudio;

      selectedAddCategoryIds = [];
      currentCoverPhotoDataUrl = '';
      setCoverMode('text');
      selectColor('#FFF6D6');
      document.getElementById('selected-card-icon').value = '🌟';

      renderAddModalCategoryBubbles();
      updateTilePreview();
    }

    document.getElementById('btn-cancel-edit').addEventListener('click', cancelEditMode);

    document.getElementById('btn-submit-card').addEventListener('click', async () => {
      const titleInput = document.getElementById('new-title');
      const title = titleInput.value.trim();
      if (!title) return;

      const cardId = editingCardId || ('card-' + Date.now());
      const existingCard = editingCardId ? cards.find(c => c.id === editingCardId) : null;

      let coverUrl = existingCard ? (existingCard.coverUrl || '') : '';
      if (currentCoverType === 'image') {
        if (currentCoverPhotoDataUrl) {
          coverUrl = currentCoverPhotoDataUrl;
        } else {
          const fileInput = document.getElementById('file-cover-input');
          if (fileInput.files && fileInput.files[0]) {
            coverUrl = await readFileAsDataUrl(fileInput.files[0]);
          } else if (!coverUrl) {
            coverUrl = 'https://placehold.co/400x400/FAF3DF/786B59?text=' + encodeURIComponent(title);
          }
        }
      }

      let audioType = existingCard ? existingCard.audioType : 'file';
      let ytId = existingCard ? (existingCard.ytId || '') : '';
      let streamUrl = existingCard ? (existingCard.streamUrl || '') : '';

      if (currentAudioSourceType === 'youtube') {
        const ytUrl = document.getElementById('input-yt-url').value.trim();
        const extracted = extractYoutubeId(ytUrl);
        if (extracted) {
          ytId = extracted;
          audioType = 'youtube';
        }
      } else if (currentAudioSourceType === 'url') {
        const rawUrl = document.getElementById('input-stream-url').value.trim();
        if (rawUrl) {
          audioType = 'url';
          streamUrl = rawUrl;
        }
      } else if (currentAudioSourceType === 'file') {
        const audioFileInput = document.getElementById('file-audio-input');
        if (audioFileInput.files && audioFileInput.files[0]) {
          const file = audioFileInput.files[0];
          audioType = 'file';
          await saveAudioToDB(cardId, file);
        }
      }

      const cardData = {
        id: cardId,
        title,
        categories: [...selectedAddCategoryIds],
        coverType: currentCoverType,
        coverUrl,
        bgColorHex: document.getElementById('selected-tile-hex').value || '#FFF6D6',
        icon: document.getElementById('selected-card-icon').value.trim() || '🌟',
        audioType,
        ytId,
        streamUrl
      };

      if (editingCardId) {
        const idx = cards.findIndex(c => c.id === editingCardId);
        if (idx !== -1) {
          cards[idx] = { ...cards[idx], ...cardData };
        }
      } else {
        cards.unshift(cardData);
      }

      saveLocalData();
      renderPage();
      renderModalCardList();
      cancelEditMode();
      syncToFamilyCloud();
    });

    document.getElementById('file-cover-input').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      const lbl = document.getElementById('label-cover-filename');
      if (file) {
        if (lbl) lbl.textContent = `📷 ${file.name}`;
        const reader = new FileReader();
        reader.onload = (event) => {
          currentCoverPhotoDataUrl = event.target.result;
          updateTilePreview();
        };
        reader.readAsDataURL(file);
      } else if (!editingCardId) {
        currentCoverPhotoDataUrl = '';
        updateTilePreview();
      }
    });

    document.getElementById('file-audio-input').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      const lbl = document.getElementById('label-audio-filename');
      if (file && lbl) {
        lbl.textContent = `🎵 ${file.name}`;
      }
    });

    function toggleCardCategory(cardId, catObj) {
      const card = cards.find(c => c.id === cardId);
      if (!card) return;

      if (!Array.isArray(card.categories)) {
        card.categories = card.theme ? [card.theme] : [];
      }

      const isAssigned = cardHasCategory(card, catObj);

      if (isAssigned) {
        card.categories = card.categories.filter(val => val !== catObj.id && val !== catObj.name);
      } else {
        card.categories.push(catObj.id);
      }

      saveLocalData();
      renderPage();
      renderModalCardList();
      syncToFamilyCloud();
    }

    function renderModalCardList() {
      const listEl = document.getElementById('modal-card-list');
      const badge = document.getElementById('total-count-badge');
      badge.textContent = `${cards.length}`;
      listEl.innerHTML = '';

      const validCategories = categories.filter(cat => cat.id !== 'all');

      let filteredCards = cards.filter(c => {
        const matchTitle = !modalSearchTerm || c.title.toLowerCase().includes(modalSearchTerm);
        let matchCat = modalFilterCategory === 'all';
        if (!matchCat) {
          const targetCat = categories.find(cat => cat.id === modalFilterCategory);
          if (targetCat) {
            matchCat = cardHasCategory(c, targetCat);
          } else {
            const cats = Array.isArray(c.categories) ? c.categories : (c.theme ? [c.theme] : []);
            matchCat = cats.includes(modalFilterCategory);
          }
        }
        return matchTitle && matchCat;
      });

      if (filteredCards.length === 0) {
        const emptyMsg = (I18N[currentUiLang] || I18N.ko).emptyList;
        listEl.innerHTML = `
          <div class="py-3 text-center text-xs text-stone-400 font-medium">
            ${emptyMsg}
          </div>
        `;
        return;
      }

      filteredCards.forEach((c) => {
        const originalIndex = cards.findIndex(card => card.id === c.id);
        const isFirst = originalIndex === 0;
        const isLast = originalIndex === cards.length - 1;

        const item = document.createElement('div');
        item.className = 'flex flex-col p-2 bg-stone-50 hover:bg-stone-100/70 rounded-xl border border-stone-200 gap-1.5 transition-colors';
        
        let visualThumb = '';
        if (c.coverType === 'image' && c.coverUrl) {
          visualThumb = `<img src="${c.coverUrl}" alt="${c.title}" class="w-6 h-6 rounded-md object-cover flex-shrink-0 border border-stone-200">`;
        } else {
          visualThumb = `<span class="text-xs flex-shrink-0">${c.icon || '📖'}</span>`;
        }

        const topRow = document.createElement('div');
        topRow.className = 'flex items-center justify-between w-full';
        topRow.innerHTML = `
          <div class="flex items-center gap-1.5 truncate flex-1 min-w-0 mr-1.5 cursor-pointer btn-edit-trigger">
            ${visualThumb}
            <span class="font-bold text-xs text-stone-800 truncate">${c.title}</span>
          </div>

          <div class="flex items-center gap-1 flex-shrink-0">
            <button class="btn-edit-item w-5 h-5 rounded-md bg-white border border-stone-200/90 text-stone-600 hover:text-amber-800 flex items-center justify-center text-[10px] active:scale-95 shadow-sm" title="수정">
              <i class="fa-solid fa-pen-to-square"></i>
            </button>
            <button class="btn-move-up w-5 h-5 rounded-md bg-white border border-stone-200/90 text-stone-600 hover:text-stone-900 disabled:opacity-20 disabled:pointer-events-none flex items-center justify-center text-[9px] active:scale-95 shadow-sm"
                    ${isFirst ? 'disabled' : ''}>
              <i class="fa-solid fa-chevron-up"></i>
            </button>
            <button class="btn-move-down w-5 h-5 rounded-md bg-white border border-stone-200/90 text-stone-600 hover:text-stone-900 disabled:opacity-20 disabled:pointer-events-none flex items-center justify-center text-[9px] active:scale-95 shadow-sm"
                    ${isLast ? 'disabled' : ''}>
              <i class="fa-solid fa-chevron-down"></i>
            </button>
            <button class="btn-del w-5 h-5 rounded-md bg-white border border-stone-200/90 text-stone-400 hover:text-rose-500 flex items-center justify-center text-[10px] active:scale-95 transition-colors shadow-sm"
                    data-id="${c.id}">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        `;

        topRow.querySelector('.btn-edit-trigger').addEventListener('click', () => startEditCard(c));
        topRow.querySelector('.btn-edit-item').addEventListener('click', (e) => {
          e.stopPropagation();
          startEditCard(c);
        });

        topRow.querySelector('.btn-move-up').addEventListener('click', (e) => {
          e.stopPropagation();
          if (originalIndex > 0) {
            const temp = cards[originalIndex];
            cards[originalIndex] = cards[originalIndex - 1];
            cards[originalIndex - 1] = temp;
            saveLocalData();
            renderPage();
            renderModalCardList();
            syncToFamilyCloud();
          }
        });

        topRow.querySelector('.btn-move-down').addEventListener('click', (e) => {
          e.stopPropagation();
          if (originalIndex < cards.length - 1) {
            const temp = cards[originalIndex];
            cards[originalIndex] = cards[originalIndex + 1];
            cards[originalIndex + 1] = temp;
            saveLocalData();
            renderPage();
            renderModalCardList();
            syncToFamilyCloud();
          }
        });

        topRow.querySelector('.btn-del').addEventListener('click', async (e) => {
          e.stopPropagation();
          await deleteAudioFromDB(c.id);
          cards = cards.filter(card => card.id !== c.id);
          if (editingCardId === c.id) cancelEditMode();
          saveLocalData();
          renderPage();
          renderModalCardList();
          syncToFamilyCloud();
        });

        item.appendChild(topRow);

        if (validCategories.length > 0) {
          const catRow = document.createElement('div');
          catRow.className = 'flex flex-wrap gap-1 items-center pt-0.5 border-t border-stone-200/60';
          
          validCategories.forEach(cat => {
            const isAssigned = cardHasCategory(c, cat);
            const tagBtn = document.createElement('button');
            tagBtn.type = 'button';
            tagBtn.className = `px-1.5 py-0.5 rounded text-[10px] font-bold border transition-all ${
              isAssigned 
                ? 'bg-amber-100 border-amber-300 text-stone-800' 
                : 'bg-white border-stone-200/80 text-stone-400 opacity-60'
            }`;
            tagBtn.innerHTML = `<span>${cat.icon || '🔖'}</span>${cat.name ? ` <span>${cat.name}</span>` : ''}`;
            tagBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              toggleCardCategory(c.id, cat);
            });
            catRow.appendChild(tagBtn);
          });

          item.appendChild(catRow);
        }

        listEl.appendChild(item);
      });
    }

    document.getElementById('btn-save-family-key').addEventListener('click', () => {
      const val = document.getElementById('family-sync-key').value.trim();
      familySyncKey = val;
      localStorage.setItem('baby_family_sync_key', familySyncKey);

      if (familySyncKey) {
        startFamilyPolling();
        fetchFromFamilyCloud();
      } else {
        if (cloudPollInterval) clearInterval(cloudPollInterval);
      }
    });

    async function syncToFamilyCloud() {
      if (!familySyncKey) return;
      try {
        const cloudData = {
          cards: cards.map(c => {
            const clone = { ...c };
            delete clone.audioBlobUrl;
            return clone;
          }),
          categories,
          cooldownSec,
          updatedAt: Date.now()
        };

        await fetch(`https://api.counterapi.dev/v1/bebe_${encodeURIComponent(familySyncKey)}/up`, {
          method: 'GET',
          mode: 'no-cors'
        }).catch(()=>{});

        localStorage.setItem(`cloud_last_${familySyncKey}`, JSON.stringify(cloudData));
      } catch (e) {}
    }

    async function fetchFromFamilyCloud() {
      if (!familySyncKey) return;
      try {
        const cached = localStorage.getItem(`cloud_last_${familySyncKey}`);
        if (cached) {
          const parsed = JSON.parse(cached);
          if (parsed && parsed.cards) {
            mergeIncomingCards(parsed.cards);
            if (parsed.categories) categories = parsed.categories;
            if (parsed.cooldownSec) cooldownSec = parsed.cooldownSec;
            saveLocalData();
            renderFilterChips();
            renderPage();
            renderModalCategoryTags();
            renderModalCardList();
            renderAddModalCategoryBubbles();
          }
        }
      } catch (e) {}
    }

    function startFamilyPolling() {
      if (cloudPollInterval) clearInterval(cloudPollInterval);
      cloudPollInterval = setInterval(() => {
        if (familySyncKey) fetchFromFamilyCloud();
      }, 5000);
    }

    document.getElementById('btn-export-bundle').addEventListener('click', async () => {
      const exportCards = [];
      const audioFilesMap = {};

      for (const c of cards) {
        const clone = { ...c };
        delete clone.audioBlobUrl;
        exportCards.push(clone);

        if (c.audioType === 'file') {
          const blob = await getAudioFromDB(c.id);
          if (blob) {
            audioFilesMap[c.id] = await blobToBase64(blob);
          }
        }
      }

      const bundleObject = {
        app: 'BebeSound',
        version: 2,
        exportedAt: new Date().toISOString(),
        cards: exportCards,
        categories,
        cooldownSec,
        audioFiles: audioFilesMap
      };

      const jsonStr = JSON.stringify(bundleObject);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const fileName = `베베사운드_보따리_${new Date().toISOString().slice(0,10)}.json`;

      if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([blob], fileName, { type: 'application/json' })] })) {
        try {
          const file = new File([blob], fileName, { type: 'application/json' });
          await navigator.share({
            files: [file],
            title: '베베사운드 보따리'
          });
          return;
        } catch(e) {}
      }

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    document.getElementById('input-import-bundle').addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (event) => {
        try {
          const bundle = JSON.parse(event.target.result);
          if (!bundle || !bundle.cards) return;

          if (bundle.audioFiles) {
            for (const [id, base64Data] of Object.entries(bundle.audioFiles)) {
              if (base64Data) {
                const blob = base64ToBlob(base64Data);
                await saveAudioToDB(id, blob);
              }
            }
          }

          mergeIncomingCards(bundle.cards);

          if (bundle.categories && Array.isArray(bundle.categories)) {
            bundle.categories.forEach(inCat => {
              if (!categories.find(c => c.id === inCat.id)) {
                categories.push(inCat);
              }
            });
          }

          if (bundle.cooldownSec) {
            cooldownSec = bundle.cooldownSec;
            cooldownInput.value = cooldownSec;
            cooldownVal.textContent = `${cooldownSec}${(I18N[currentUiLang] || I18N.ko).cooldownSuffix}`;
          }

          saveLocalData();
          await preloadAllAudioBlobs();
          renderFilterChips();
          renderPage();
          renderModalCategoryTags();
          renderModalCardList();
          renderAddModalCategoryBubbles();
          updateCategorySelectOptions();
        } catch(err) {}
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    function mergeIncomingCards(incomingCards) {
      incomingCards.forEach(inCard => {
        const existingIdx = cards.findIndex(c => c.id === inCard.id);
        if (existingIdx !== -1) {
          cards[existingIdx] = { ...cards[existingIdx], ...inCard };
        } else {
          cards.push(inCard);
        }
      });
    }

    const resetBtn = document.getElementById('btn-reset-preset');
    resetBtn.addEventListener('click', () => {
      const t = I18N[currentUiLang] || I18N.ko;
      if (!resetConfirmPending) {
        resetConfirmPending = true;
        resetBtn.textContent = t.resetConfirm;
        resetBtn.className = 'text-xs text-rose-500 font-bold underline transition-colors';
        setTimeout(() => {
          resetConfirmPending = false;
          resetBtn.textContent = t.resetBtn;
          resetBtn.className = 'text-xs text-stone-400 hover:text-stone-600 underline font-semibold transition-colors';
        }, 3500);
        return;
      }

      resetConfirmPending = false;
      resetBtn.textContent = t.resetBtn;
      resetBtn.className = 'text-xs text-stone-400 hover:text-stone-600 underline font-semibold transition-colors';

      cards = [];
      categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
      cooldownSec = 6;
      cooldownInput.value = 6;
      cooldownVal.textContent = `6${t.cooldownSuffix}`;
      activeFilter = 'all';
      modalSearchTerm = '';
      modalFilterCategory = 'all';
      selectedAddCategoryIds = [];
      localStorage.removeItem('baby_soundbook_vclean');
      saveLocalData();
      renderFilterChips();
      renderPage();
      renderModalCategoryTags();
      renderModalCardList();
      renderAddModalCategoryBubbles();
    });

    function extractYoutubeId(url) {
      if (!url) return '';
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : '';
    }

    function saveLocalData() {
      const persistable = cards.map(c => {
        const clone = { ...c };
        if (clone.audioBlobUrl) delete clone.audioBlobUrl;
        return clone;
      });
      localStorage.setItem('baby_soundbook_vclean', JSON.stringify({ 
        cards: persistable, 
        categories, 
        cooldownSec,
        repeatCountLimit 
      }));
    }

    function loadLocalData() {
      const saved = localStorage.getItem('baby_soundbook_vclean');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          cards = Array.isArray(parsed.cards) ? parsed.cards : [];
          categories = (parsed.categories && Array.isArray(parsed.categories)) ? parsed.categories : JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
          if (parsed.cooldownSec) {
            cooldownSec = parsed.cooldownSec;
            cooldownInput.value = cooldownSec;
          }
          if (typeof parsed.repeatCountLimit === 'number') {
            repeatCountLimit = parsed.repeatCountLimit;
          }
        } catch (e) {
          cards = [];
          categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
        }
      } else {
        cards = [];
        categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
      }

      familySyncKey = localStorage.getItem('baby_family_sync_key') || '';
      if (familySyncKey) {
        startFamilyPolling();
      }

      const savedLang = localStorage.getItem('baby_ui_lang');
      setUiLanguage(savedLang || 'ko');
    }

    window.onYouTubeIframeAPIReady = function() {
      try {
        ytPlayer = new YT.Player('yt-player-slot', {
          height: '1',
          width: '1',
          videoId: '',
          playerVars: {
            playsinline: 1,
            controls: 0,
            disablekb: 1,
            fs: 0
          },
          events: {
            onReady: () => { isYtReady = true; },
            onStateChange: (e) => {
              if (e.data === YT.PlayerState.ENDED) onTrackEnded();
            }
          }
        });
      } catch(e) {
        isYtReady = false;
      }
    };

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    async function initApp() {
      await initDB();
      loadLocalData();
      await preloadAllAudioBlobs();
      renderFilterChips();
      renderPage();
      updateControlButtons();
      updateRepeatLimitUI();
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
