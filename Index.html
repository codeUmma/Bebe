<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>베베사운드</title>

  <!-- iOS 웹앱 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="베베사운드">
  <meta name="theme-color" content="#F7F4EE">

  <script>
    (function() {
      try {
        const c = document.createElement('canvas');
        c.width = 180;
        c.height = 180;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#FDFBF7';
        ctx.fillRect(0, 0, 180, 180);
        ctx.fillStyle = '#FAF0DD';
        if (ctx.roundRect) {
          ctx.beginPath();
          ctx.roundRect(14, 14, 152, 152, 36);
          ctx.fill();
        } else {
          ctx.fillRect(14, 14, 152, 152);
        }
        ctx.font = '86px "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🎶', 90, 93);

        const iconUrl = c.toDataURL('image/png');
        const appleIcon = document.createElement('link');
        appleIcon.rel = 'apple-touch-icon';
        appleIcon.href = iconUrl;
        document.head.appendChild(appleIcon);

        const fav = document.createElement('link');
        fav.rel = 'icon';
        fav.type = 'image/png';
        fav.href = iconUrl;
        document.head.appendChild(fav);
      } catch(e) {}
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    :root {
      --bg-warm: #F7F4EE;
      --paper-cream: #FCFAF6;
      --paper-border: #E8E1D5;
      --stack-shadow: #DFD7C8;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }

    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: var(--bg-warm);
      color: #38312C;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      letter-spacing: -0.02em;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .songbook-stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 1.5rem;
    }

    .songbook-stack-base {
      position: absolute;
      inset: 0;
      border-radius: 1.5rem;
      background: #EDE6DB;
      box-shadow: 
        1px 2px 0 var(--stack-shadow),
        3px 4px 0 #D5CBB9,
        0 12px 24px rgba(70, 50, 30, 0.08);
      z-index: 1;
    }

    .songbook-sheet {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: var(--paper-cream);
      border-radius: 1.5rem;
      border: 1px solid var(--paper-border);
      overflow: hidden;
      will-change: transform, box-shadow;
    }

    .binder-ring-hole {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: #8A7E72;
      box-shadow: inset 1px 1px 2px rgba(0,0,0,0.35), 0 0 0 2px #EDE7DC;
    }

    .sheet-slide-out-left {
      animation: animSlideOutLeft 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes animSlideOutLeft {
      0% {
        transform: translateX(0);
        box-shadow: 2px 0 12px rgba(60, 45, 30, 0.06);
      }
      100% {
        transform: translateX(-105%);
        box-shadow: 20px 0 30px rgba(60, 45, 30, 0.16);
      }
    }

    .sheet-slide-in-from-left {
      animation: animSlideInLeft 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes animSlideInLeft {
      0% {
        transform: translateX(-105%);
        box-shadow: 20px 0 30px rgba(60, 45, 30, 0.16);
      }
      100% {
        transform: translateX(0);
        box-shadow: 2px 0 12px rgba(60, 45, 30, 0.06);
      }
    }

    .soundbook-tile {
      box-shadow: 0 3px 0 #D8D0C3, 0 5px 10px rgba(50, 40, 30, 0.04);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      touch-action: manipulation;
      outline: none !important;
    }
    .soundbook-tile:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #D8D0C3;
    }
    .soundbook-tile.is-playing {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #D8D0C3 !important;
      border-color: #D3C4AF !important;
    }

    .color-swatch {
      position: relative;
      transition: transform 0.1s ease;
    }
    .color-swatch:active {
      transform: scale(0.92);
    }
  </style>
</head>

  <script>
    const I18N = {
      ko: {
        settingsTitle: '설정',

        inputStreamPlaceholder: '음원 주소',

    function initDB() {
      return new Promise((resolve) => {
        const request = indexedDB.open('BabySoundbookDB', 1);
        request.onupgradeneeded = (e) => {
          const dbInstance = e.target.result;
          if (!dbInstance.objectStoreNames.contains('audioFiles')) {
            dbInstance.createObjectStore('audioFiles', { keyPath: 'id' });
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        request.onerror = () => resolve(null);
      });
    }

    function saveAudioToDB(id, blob) {
      if (!db) return Promise.resolve();
      return new Promise((resolve) => {
        const tx = db.transaction('audioFiles', 'readwrite');
        const store = tx.objectStore('audioFiles');
        store.put({ id, blob });
        tx.oncomplete = () => {
          audioBlobCache.set(id, URL.createObjectURL(blob));
          resolve();
        };
        tx.onerror = () => resolve();
      });
    }

    function getAudioFromDB(id) {
      if (!db) return Promise.resolve(null);
      return new Promise((resolve) => {
        const tx = db.transaction('audioFiles', 'readonly');
        const store = tx.objectStore('audioFiles');
        const request = store.get(id);
        request.onsuccess = () => resolve(request.result ? request.result.blob : null);
        request.onerror = () => resolve(null);
      });
    }

    function deleteAudioFromDB(id) {
      if (audioBlobCache.has(id)) {
        try { URL.revokeObjectURL(audioBlobCache.get(id)); } catch(e){}
        audioBlobCache.delete(id);
      }
      if (!db) return Promise.resolve();
      return new Promise((resolve) => {
        const tx = db.transaction('audioFiles', 'readwrite');
        const store = tx.objectStore('audioFiles');
        store.delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      });
    }

    async function preloadAllAudioBlobs() {
      for (const card of cards) {
        if (card.audioType === 'file' && !audioBlobCache.has(card.id)) {
          const blob = await getAudioFromDB(card.id);
          if (blob) {
            audioBlobCache.set(card.id, URL.createObjectURL(blob));
          }
        }
      }

    function blobToBase64(blob) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = () => resolve('');
        reader.readAsDataURL(blob);
      });
    }

    function base64ToBlob(base64Data) {
      const parts = base64Data.split(';base64,');
      const contentType = parts[0].split(':')[1];
      const raw = window.atob(parts[1]);
      const rawLength = raw.length;
      const uInt8Array = new Uint8Array(rawLength);
      for (let i = 0; i < rawLength; ++i) {
        uInt8Array[i] = raw.charCodeAt(i);
      }
      return new Blob([uInt8Array], { type: contentType });
    }

      return new Promise((resolve) => {

        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = () => resolve('');
        reader.readAsDataURL(file);
      });
    }

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    const NOTE_FREQ = {
      C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
      C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00
    };

    const MELODIES = {
      twinkle: [
        { n: 'C4', d: 0.4 }, { n: 'C4', d: 0.4 }, { n: 'G4', d: 0.4 }, { n: 'G4', d: 0.4 },
        { n: 'A4', d: 0.4 }, { n: 'A4', d: 0.4 }, { n: 'G4', d: 0.8 }
      ]
    };

    function playSynthMelody(key, onComplete) {
      initAudioContext();
      stopSynth();

      const notes = MELODIES.twinkle;
      let noteIndex = 0;

      function playNext() {
        if (!currentPlaying) return;
        if (noteIndex >= notes.length) {
          if (onComplete) onComplete();
          return;
        }

        const item = notes[noteIndex++];
        const freq = NOTE_FREQ[item.n] || 440;
        const duration = item.d;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        const now = audioCtx.currentTime;
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.16, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration + 0.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + duration + 0.25);

        synthTimer = setTimeout(playNext, (duration + 0.08) * 1000);
      }

      playNext();
    }

    function stopSynth() {
      if (synthTimer) {
        clearTimeout(synthTimer);
        synthTimer = null;
      }
    }

    function onTilePress(card) {
      initAudioContext();
      const now = Date.now();

      if (currentPlaying && currentPlaying.id === card.id) {
        const elapsed = (now - playingStartTime) / 1000;
        if (elapsed < cooldownSec) {
          return;
        }
      }

      if (isShuffleActive || playbackMode === 'sequential') {
        const idx = currentPlaylist.findIndex(c => c.id === card.id);
        if (idx !== -1) currentPlaylistIndex = idx;
      }

      playSong(card);
    }

    function formatAudioStreamUrl(rawUrl) {
      if (!rawUrl) return '';
      if (rawUrl.includes('drive.google.com')) {
        const match = rawUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (match && match[1]) {
          return `https://drive.google.com/uc?export=download&id=${match[1]}`;
        }
      }
      return rawUrl;
    }

    function playSong(card) {
      stopAudioEngine();

      currentPlaying = card;
      playingStartTime = Date.now();
      updateTileStyles();

      if (card.audioType === 'file') {
        let blobUrl = audioBlobCache.get(card.id);
        if (blobUrl) {
          localAudio.src = blobUrl;
          localAudio.play().catch(() => playSynthFallback(card));
          localAudio.onended = onTrackEnded;
          return;
        }
      }

      if (card.audioType === 'url' && card.streamUrl) {
        const finalUrl = formatAudioStreamUrl(card.streamUrl);
        localAudio.src = finalUrl;
        localAudio.play().catch(() => playSynthFallback(card));
        localAudio.onended = onTrackEnded;
        return;
      }

      if (card.audioType === 'youtube' && card.ytId && isYtReady && ytPlayer) {
        try {
          ytPlayer.loadVideoById(card.ytId);
          ytPlayer.playVideo();
          return;
        } catch (e) {
          playSynthFallback(card);
          return;
        }
      }

      playSynthFallback(card);
    }

    function playSynthFallback(card) {
      playSynthMelody('twinkle', onTrackEnded);
    }

    function onTrackEnded() {
      if (isShuffleActive || playbackMode === 'sequential') {
        playNextInPlaylist();
      } else {
        stopAudioEngine();
        currentPlaying = null;
        updateTileStyles();
      }
    }

    function playNextInPlaylist() {
      if (!currentPlaylist.length) return;
      currentPlaylistIndex = (currentPlaylistIndex + 1) % currentPlaylist.length;
      const nextCard = currentPlaylist[currentPlaylistIndex];

      const filtered = getFilteredCards();
      const nextIndexInFiltered = filtered.findIndex(c => c.id === nextCard.id);
      if (nextIndexInFiltered !== -1) {
        const targetPage = Math.floor(nextIndexInFiltered / CARDS_PER_PAGE) + 1;
        if (targetPage !== currentPage) {
          flipPage(targetPage > currentPage ? 'forward' : 'backward', targetPage);
        }
      }

      playSong(nextCard);
    }

    function stopAudioEngine() {
      stopSynth();
      try {
        localAudio.pause();
        localAudio.currentTime = 0;
      } catch(e){}

      if (isYtReady && ytPlayer && ytPlayer.stopVideo) {
        try { ytPlayer.stopVideo(); } catch(e){}
      }
    }

    function stopPlayback(isManualStop = false) {
      currentPlaying = null;
      stopAudioEngine();

      if (isManualStop && playbackMode === 'sequential') {
        playbackMode = 'single';
      }

      updateControlButtons();
      updateTileStyles();
    }

    function getFilteredCards() {
      if (activeFilter === 'all') return cards;
      return cards.filter(c => {
        if (Array.isArray(c.categories)) {
          return c.categories.includes(activeFilter);
        }
        return c.theme === activeFilter;
      });
    }

    function getPageCards(pageNum) {
      const filtered = getFilteredCards();
      const start = (pageNum - 1) * CARDS_PER_PAGE;
      return filtered.slice(start, start + CARDS_PER_PAGE);
    }

    function flipPage(direction, targetPageNumber) {
      if (isPageFlipping) return;
      const filtered = getFilteredCards();
      const totalPages = Math.max(1, Math.ceil(filtered.length / CARDS_PER_PAGE));
      if (targetPageNumber < 1 || targetPageNumber > totalPages) return;

      isPageFlipping = true;
      const stage = document.getElementById('book-stage');
      const activeSheet = document.getElementById('active-sheet');
      const underSheet = document.getElementById('under-sheet');
      const underGrid = underSheet.querySelector('.under-grid');

      if (direction === 'forward') {
        populateGridCards(underGrid, getPageCards(targetPageNumber));
        activeSheet.className = 'songbook-sheet flex items-stretch z-20 sheet-slide-out-left';

        currentPage = targetPageNumber;
        updatePaginationControls(totalPages);

        setTimeout(() => {
          const activeGrid = document.getElementById('active-grid');
          populateGridCards(activeGrid, getPageCards(currentPage));
          activeSheet.className = 'songbook-sheet flex items-stretch z-20';
          isPageFlipping = false;
        }, 850);
      } else {
        const incomingSheet = underSheet.cloneNode(true);
        incomingSheet.removeAttribute('id');
        populateGridCards(incomingSheet.querySelector('.under-grid'), getPageCards(targetPageNumber));
        incomingSheet.className = 'songbook-sheet flex items-stretch z-30 sheet-slide-in-from-left';
        stage.appendChild(incomingSheet);

        currentPage = targetPageNumber;
        updatePaginationControls(totalPages);

        setTimeout(() => {
          const activeGrid = document.getElementById('active-grid');
          populateGridCards(activeGrid, getPageCards(currentPage));
          incomingSheet.remove();
          isPageFlipping = false;
        }, 850);
      }
    }

    function renderPage() {
      const filtered = getFilteredCards();
      const totalPages = Math.max(1, Math.ceil(filtered.length / CARDS_PER_PAGE));
      if (currentPage > totalPages) currentPage = totalPages;

      const pageCards = getPageCards(currentPage);
      const activeGrid = document.getElementById('active-grid');
      populateGridCards(activeGrid, pageCards);
      updatePaginationControls(totalPages);
    }

    function populateGridCards(gridContainer, pageCards) {

      pageCards.forEach(card => {

              🎵
            </div>
          `;
        }

        tile.addEventListener('click', () => onTilePress(card));
        gridContainer.appendChild(tile);
      });

      for (let i = pageCards.length; i < CARDS_PER_PAGE; i++) {
        const emptySlot = document.createElement('div');
        emptySlot.className = 'w-full h-full rounded-2xl border-2 border-dashed border-stone-200/60 bg-stone-100/20 flex flex-col items-center justify-center';

          <span class="text-stone-300 text-xl font-bold">🌱</span>

    let touchStartX = 0;
    const stageArea = document.getElementById('book-stage');
    stageArea.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    stageArea.addEventListener('touchend', e => { handleSwipe(e.changedTouches[0].clientX - touchStartX); });
    stageArea.addEventListener('mousedown', e => { touchStartX = e.clientX; });
    stageArea.addEventListener('mouseup', e => { handleSwipe(e.clientX - touchStartX); });

    function handleSwipe(deltaX) {
      if (isPageFlipping) return;
      const filtered = getFilteredCards();
      const totalPages = Math.ceil(filtered.length / CARDS_PER_PAGE);
      if (deltaX < -45 && currentPage < totalPages) {
        flipPage('forward', currentPage + 1);
      } else if (deltaX > 45 && currentPage > 1) {

    async function syncToFamilyCloud() {
      if (!familySyncKey) return;
      try {
        const cloudData = {
          cards: cards.map(c => {
            const clone = { ...c };
            delete clone.audioBlobUrl;
            return clone;
          }),
          categories,
          cooldownSec,
          updatedAt: Date.now()
        };

        await fetch(`https://api.counterapi.dev/v1/bebe_${encodeURIComponent(familySyncKey)}/up`, {
          method: 'GET',
          mode: 'no-cors'
        }).catch(()=>{});

        localStorage.setItem(`cloud_last_${familySyncKey}`, JSON.stringify(cloudData));
      } catch (e) {}
    }

    async function fetchFromFamilyCloud() {
      if (!familySyncKey) return;
      try {
        const cached = localStorage.getItem(`cloud_last_${familySyncKey}`);
        if (cached) {
          const parsed = JSON.parse(cached);
          if (parsed && parsed.cards) {
            mergeIncomingCards(parsed.cards);
            if (parsed.categories) categories = parsed.categories;
            if (parsed.cooldownSec) cooldownSec = parsed.cooldownSec;
            saveLocalData();
            renderFilterChips();
            renderPage();
            renderModalCategoryTags();
            renderModalCardList();
            renderAddModalCategoryBubbles();
          }
        }
      } catch (e) {}
    }

    function startFamilyPolling() {
      if (cloudPollInterval) clearInterval(cloudPollInterval);
      cloudPollInterval = setInterval(() => {
        if (familySyncKey) fetchFromFamilyCloud();

    document.getElementById('btn-export-bundle').addEventListener('click', async () => {
      const exportCards = [];
      const audioFilesMap = {};

      for (const c of cards) {
        const clone = { ...c };
        delete clone.audioBlobUrl;
        exportCards.push(clone);

        if (c.audioType === 'file') {
          const blob = await getAudioFromDB(c.id);
          if (blob) {
            audioFilesMap[c.id] = await blobToBase64(blob);
          }
        }
      }

      const bundleObject = {
        app: 'BebeSound',
        version: 2,
        exportedAt: new Date().toISOString(),
        cards: exportCards,
        categories,
        cooldownSec,
        audioFiles: audioFilesMap
      };

      const jsonStr = JSON.stringify(bundleObject);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const fileName = `베베사운드_보따리_${new Date().toISOString().slice(0,10)}.json`;

      if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([blob], fileName, { type: 'application/json' })] })) {
        try {
          const file = new File([blob], fileName, { type: 'application/json' });
          await navigator.share({
            files: [file],
            title: '베베사운드 보따리'
          });
          return;
        } catch(e) {}
      }

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    document.getElementById('input-import-bundle').addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (event) => {
        try {
          const bundle = JSON.parse(event.target.result);
          if (!bundle || !bundle.cards) return;

          if (bundle.audioFiles) {
            for (const [id, base64Data] of Object.entries(bundle.audioFiles)) {
              if (base64Data) {
                const blob = base64ToBlob(base64Data);
                await saveAudioToDB(id, blob);
              }
            }
          }

          mergeIncomingCards(bundle.cards);

          if (bundle.categories && Array.isArray(bundle.categories)) {
            bundle.categories.forEach(inCat => {
              if (!categories.find(c => c.id === inCat.id)) {
                categories.push(inCat);
              }
            });
          }

          if (bundle.cooldownSec) {
            cooldownSec = bundle.cooldownSec;
            cooldownInput.value = cooldownSec;
            cooldownVal.textContent = `${cooldownSec}${I18N[currentUiLang].cooldownSuffix}`;
          }

          saveLocalData();
          await preloadAllAudioBlobs();
          renderFilterChips();
          renderPage();
          renderModalCategoryTags();
          renderModalCardList();
          renderAddModalCategoryBubbles();
          updateCategorySelectOptions();
        } catch(err) {}
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    function mergeIncomingCards(incomingCards) {
      incomingCards.forEach(inCard => {
        const existingIdx = cards.findIndex(c => c.id === inCard.id);
        if (existingIdx !== -1) {
          cards[existingIdx] = { ...cards[existingIdx], ...inCard };

          cards.push(inCard);

    function extractYoutubeId(url) {
      if (!url) return '';
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : '';
    }

    function saveLocalData() {
      const persistable = cards.map(c => {
        const clone = { ...c };
        if (clone.audioBlobUrl) delete clone.audioBlobUrl;
        return clone;
      });
      localStorage.setItem('baby_soundbook_vclean', JSON.stringify({ cards: persistable, categories, cooldownSec }));
    }

    function loadLocalData() {
      const saved = localStorage.getItem('baby_soundbook_vclean');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          cards = Array.isArray(parsed.cards) ? parsed.cards : [];
          categories = (parsed.categories && Array.isArray(parsed.categories)) ? parsed.categories : JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
          if (parsed.cooldownSec) {
            cooldownSec = parsed.cooldownSec;
            cooldownInput.value = cooldownSec;
          }
        } catch (e) {
          cards = [];
          categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
        }
      } else {
        cards = [];
        categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
      }

      familySyncKey = localStorage.getItem('baby_family_sync_key') || '';
      if (familySyncKey) {
        startFamilyPolling();
      }

      const savedLang = localStorage.getItem('baby_ui_lang');
      setUiLanguage(savedLang || 'ko');
    }

    window.onYouTubeIframeAPIReady = function() {
      try {
        ytPlayer = new YT.Player('yt-player-slot', {
          height: '1',
          width: '1',
          videoId: '',
          playerVars: {
            playsinline: 1,
            controls: 0,
            disablekb: 1,
            fs: 0
          },
          events: {
            onReady: () => { isYtReady = true; },
            onStateChange: (e) => {
              if (e.data === YT.PlayerState.ENDED) onTrackEnded();
            },
            onError: () => {
              if (currentPlaying) playSynthFallback(currentPlaying);
            }
          }
        });
      } catch(e) {
        isYtReady = false;
      }
    };

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    window.onload = async function() {
      await initDB();
      loadLocalData();
      await preloadAllAudioBlobs();
      renderFilterChips();
      renderPage();
      updateControlButtons();
    };
  </script>
</body>
</html>
