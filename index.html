<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bebe Audio - 서재 & 플레이어</title>
  <style>
    :root {
      --primary-color: #ff8b94;
      --bg-color: #fcfbf9;
      --card-bg: #ffffff;
      --text-main: #333333;
      --text-sub: #777777;
      --border-color: #eee;
    }
    body {
      font-family: 'Apple SD Gothic Neo', sans-serif;
      background: var(--bg-color);
      margin: 0;
      padding: 20px;
      color: var(--text-main);
      padding-bottom: 120px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h2 {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #555;
    }
    .song-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .song-card {
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 14px;
      gap: 10px;
      transition: all 0.2s ease;
    }
    .song-card:hover {
      border-color: var(--primary-color);
    }
    .song-main-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .song-left {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      flex: 1;
    }
    .song-card img {
      width: 55px;
      height: 55px;
      border-radius: 10px;
      object-fit: cover;
    }
    .song-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .song-title {
      font-weight: bold;
      font-size: 1rem;
    }
    /* 반복 횟수 뱃지 */
    .repeat-badge {
      background: #fff0f3;
      color: #ff5c8a;
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 0.75rem;
      width: fit-content;
      font-weight: bold;
    }
    /* 수정 폼 스타일 */
    .edit-form {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: #fdfdfd;
      padding: 12px;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      margin-top: 5px;
    }
    .edit-form label {
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: bold;
    }
    .edit-form input {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    button {
      padding: 6px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .btn-edit {
      background: #f1f3f5;
      color: #495057;
    }
    .btn-save {
      background: #ff8b94;
      color: white;
    }
    .btn-cancel {
      background: #adb5bd;
      color: white;
    }
    /* 하단 고정 플레이어 */
    .player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 15px 20px;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 600px;
      margin: 0 auto;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }
    .player-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
    }
    audio {
      width: 100%;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>📚 서재 꾸러미 & 재생 목록</h2>
  <div id="song-container" class="song-list">
    <!-- 자바스크립트로 동적 렌더링 됩니다 -->
  </div>
</div>

<!-- 하단 플레이어 -->
<div class="player-bar">
  <div class="player-info">
    <span id="now-playing" style="font-weight: bold;">🎵 재생 중인 곡이 없습니다.</span>
    <span id="play-count-status" style="color: #ff5c8a; font-weight: bold;"></span>
  </div>
  <audio id="main-audio" controls></audio>
</div>

<script>
  // 1. 서재 꾸러미 및 오디오 데이터 (실제 연동 환경에 맞춰 활용)
  let songs = [
    { id: 1, title: '엄마와 함께 옹알이 동요', thumbnail_url: 'https://via.placeholder.com/55', file_url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', repeat_count: 2 },
    { id: 2, title: '스위트 룰루 자장가', thumbnail_url: 'https://via.placeholder.com/55', file_url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', repeat_count: 1 }
  ];

  let currentSong = null;
  let currentPlayCount = 1; // 현재 곡 반복 재생 횟수 추적
  const audioPlayer = document.getElementById('main-audio');

  // 화면에 곡 리스트 렌더링 (서재 꾸러미 데이터 우선 반영)
  function renderSongs() {
    const container = document.getElementById('song-container');
    container.innerHTML = '';

    songs.forEach(song => {
      const card = document.createElement('div');
      card.className = 'song-card';
      card.innerHTML = `
        <div class="song-main-row">
          <div class="song-left" onclick="playSong(${song.id})">
            <img src="${song.thumbnail_url}" alt="썸네일" id="thumb-${song.id}">
            <div class="song-info">
              <span class="song-title" id="title-${song.id}">${song.title}</span>
              ${song.repeat_count > 1 ? `<span class="repeat-badge">🔄 ${song.repeat_count}회 반복 설정됨</span>` : ''}
            </div>
          </div>
          <div>
            <button class="btn-edit" id="edit-btn-${song.id}" onclick="toggleEditForm(${song.id})">수정</button>
          </div>
        </div>

        <!-- 수정 폼 영역 -->
        <div class="edit-form" id="edit-form-${song.id}">
          <label>곡 제목 수정</label>
          <input type="text" id="input-title-${song.id}" value="${song.title}">
          
          <label>썸네일 이미지 주소</label>
          <input type="text" id="input-thumb-${song.id}" value="${song.thumbnail_url}">
          
          <label>이 곡의 반복 재생 횟수 (1~5회)</label>
          <input type="number" id="input-repeat-${song.id}" value="${song.repeat_count || 1}" min="1" max="5">
          
          <span id="status-${song.id}" style="font-size:0.8rem; color:#ff5c8a; font-weight:bold;"></span>
          
          <div class="btn-group">
            <button class="btn-save" id="save-btn-${song.id}" onclick="saveSongInfo(${song.id})">수정 완료</button>
            <button class="btn-cancel" onclick="toggleEditForm(${song.id})">취소</button>
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // 수정 폼 열고 닫기 토글
  function toggleEditForm(id) {
    const form = document.getElementById(`edit-form-${id}`);
    form.style.display = form.style.display === 'flex' ? 'none' : 'flex';
  }

  // 곡 정보 수정 저장 ('수정 중' 무한 로딩 방지 및 서재 꾸러미 데이터 동기화)
  async function saveSongInfo(id) {
    const editButton = document.getElementById(`edit-btn-${id}`);
    const saveButton = document.getElementById(`save-btn-${id}`);
    const statusText = document.getElementById(`status-${id}`);
    
    const newTitle = document.getElementById(`input-title-${id}`).value;
    const newThumb = document.getElementById(`input-thumb-${id}`).value;
    const newRepeat = parseInt(document.getElementById(`input-repeat-${id}`).value) || 1;

    try {
      // 1. 수정 시작 시점: 버튼 비활성화 및 '수정 중' 표시
      saveButton.disabled = true;
      editButton.disabled = true;
      statusText.innerText = '수정 중...';

      // 의도적인 딜레이 시뮬레이션 (DB 연동 시 이 자리에 Supabase 업데이트 구문 배치)
      await new Promise(resolve => setTimeout(resolve, 400));

      // 2. 서재 꾸러미 원본 데이터(songs 배열)에 즉시 반영하여 최신 상태 유지
      const target = songs.find(s => s.id === id);
      if (target) {
        target.title = newTitle;
        target.thumbnail_url = newThumb;
        target.repeat_count = newRepeat;
      }

      // 3. 화면 UI 전체 리렌더링 (서재 꾸러미 데이터 우선 반영 확인)
      renderSongs();

    } catch (error) {
      console.error('수정 중 에러 발생:', error);
      alert('수정 중 오류가 발생했습니다. 다시 시도해 주세요.');
    } finally {
      // 4. [핵심] 성공하든 실패하든 무조건 로딩 상태를 풀고 버튼을 원상복구 ('수정 중' 멈춤 현상 차단)
      saveButton.disabled = false;
      editButton.disabled = false;
      statusText.innerText = '';
    }
  }

  // 곡 재생 함수 (클릭 시 카운트 초기화)
  function playSong(id) {
    const song = songs.find(s => s.id === id);
    if (!song) return;

    currentSong = song;
    currentPlayCount = 1; // 다른 곡을 틀거나 새로 틀면 반복 카운트 리셋
    audioPlayer.src = song.file_url;
    audioPlayer.play();

    document.getElementById('now-playing').innerText = `🎵 재생 중: ${song.title}`;
    updatePlayStatusText();
  }

  // 하단 플레이어 반복 재생 상태 텍스트 업데이트
  function updatePlayStatusText() {
    if (!currentSong) return;
    const maxRepeat = currentSong.repeat_count || 1;
    const statusSpan = document.getElementById('play-count-status');
    
    if (maxRepeat > 1) {
      statusSpan.innerText = `[반복 재생: ${currentPlayCount} / ${maxRepeat}회]`;
    } else {
      statusSpan.innerText = '';
    }
  }

  // 오디오 재생 종료 이벤트 (개별 반복 횟수 처리 로직)
  audioPlayer.addEventListener('ended', () => {
    if (!currentSong) return;
    const maxRepeat = currentSong.repeat_count || 1;

    if (currentPlayCount < maxRepeat) {
      // 설정된 반복 횟수보다 적게 들었다면 해당 곡을 처음부터 다시 재생
      currentPlayCount++;
      audioPlayer.currentTime = 0;
      audioPlayer.play();
      updatePlayStatusText();
    } else {
      // 반복 횟수를 다 채웠다면 카운트 초기화 후 다음 곡으로 넘어가기
      currentPlayCount = 1;
      document.getElementById('play-count-status').innerText = '';
      
      // 다음 곡 자동 재생 연동 (현재 곡 다음 인덱스 탐색)
      const currentIndex = songs.findIndex(s => s.id === currentSong.id);
      if (currentIndex !== -1 && currentIndex + 1 < songs.length) {
        playSong(songs[currentIndex + 1].id);
      } else {
        document.getElementById('now-playing').innerText = '🎵 모든 곡 재생이 완료되었습니다.';
      }
    }
  });

  // 페이지 초기 실행 시 리스트 그리기
  renderSongs();
</script>

</body>
</html>
